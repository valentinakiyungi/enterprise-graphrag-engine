services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
      POSTGRES_DB: graphrag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag -d graphrag"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/graphrag-password
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphrag-password 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://graphrag:graphrag@postgres:5432/graphrag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_PASSWORD: graphrag-password
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }

volumes:
  pgdata:
  neo4jdata:
